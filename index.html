<!doctype html>
<html lang="en" data-ready="false">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080c" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="The Game of Life V2 — a private, offline-first life RPG with real-life HP, quests, finance and rewards." />
  <title>The Game of Life V2</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/ares.png" />
  <link rel="apple-touch-icon" href="icons/ares.png" />
  <meta name="application-name" content="The Game of Life V2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Life V2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preload" as="image" href="icons/ares.png" />
  <link rel="preload" as="image" href="icons/thief.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="app" class="app-shell" data-boot="loading">
    <header id="hud-mount" class="hud" aria-label="Player status"></header>

    <main id="view" class="view" tabindex="-1">
      <div class="boot-splash" aria-live="polite">
        <span class="boot-splash__ring" aria-hidden="true"></span>
        <span class="boot-splash__text">Loading your profile…</span>
      </div>
    </main>

    <div id="nav-mount"></div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">
      <h1>The Game of Life V2 needs JavaScript</h1>
      <p>This is an offline-first app built with native ES modules. Enable JavaScript and reload.</p>
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
